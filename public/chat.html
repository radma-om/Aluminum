<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Chat panel shown inside the company website (chat-widget.js), or on its own at /chat */
        :root {
            --primary: #1e40af; --primary-dark: #1e3a8a; --bg: #f1f5f9; --card: #fff;
            --border: #e2e8f0; --text: #1e293b; --muted: #64748b; --green: #16a34a; --wa: #25D366;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
        header {
            display: flex; align-items: center; gap: 10px; padding: 12px 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff;
        }
        header img { width: 38px; height: 38px; border-radius: 50%; background: #fff; padding: 3px; object-fit: contain; }
        header .who { flex: 1; line-height: 1.3; }
        header .name { font-weight: 700; font-size: 1rem; }
        header .state { font-size: 0.8rem; opacity: 0.85; }
        header .state::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-left: 5px; }
        header button {
            background: rgba(255, 255, 255, 0.15); border: 0; color: #fff; width: 34px; height: 34px;
            border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1;
        }
        header button:hover { background: rgba(255, 255, 255, 0.28); }
        #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; line-height: 1.7; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
        .msg a { color: inherit; font-weight: 700; }
        .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-top-right-radius: 4px; }
        .me { align-self: flex-end; background: var(--primary); color: #fff; border-top-left-radius: 4px; }
        .error { align-self: center; background: #fdecea; color: #a93226; font-size: 0.85rem; }
        .quote { align-self: flex-start; background: #e8f8ef; border: 1px solid #b7e4c7; border-radius: 14px; padding: 10px 13px; font-size: 0.9rem; }
        .quote a { display: inline-block; margin-top: 6px; background: var(--green); color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 10px; font-weight: 700; }
        .typing { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; }
        .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
        #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
        #chips button, #chips a {
            border: 1px solid var(--primary); background: #fff; color: var(--primary); border-radius: 999px;
            padding: 6px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-decoration: none;
        }
        #chips a { border-color: var(--wa); color: #128C7E; }
        form { display: flex; gap: 8px; padding: 10px; background: var(--card); border-top: 1px solid var(--border); }
        textarea {
            flex: 1; resize: none; border: 1px solid #cfd8e0; border-radius: 12px; padding: 10px 12px;
            font-size: 16px; max-height: 110px; line-height: 1.5; color: var(--text);
        }
        textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        form button {
            width: 46px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        form button:disabled { background: #90a0af; cursor: not-allowed; }
        .note { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 0 10px 8px; background: var(--card); }
    </style>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="">
        <div class="who">
            <div class="name" id="botName">المساعد الذكي</div>
            <div class="state"><span id="companyName"></span> متصل الآن</div>
        </div>
        <button type="button" id="restartBtn" title="محادثة جديدة" aria-label="محادثة جديدة">↻</button>
        <button type="button" id="closeBtn" title="إغلاق" aria-label="إغلاق" hidden>✕</button>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>
    <div id="chips"></div>

    <form id="form" autocomplete="off">
        <textarea id="input" rows="1" maxlength="1000" placeholder="اكتب رسالتك..." aria-label="رسالتك"></textarea>
        <button type="submit" id="sendBtn" aria-label="إرسال">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="transform: scaleX(-1)"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
    </form>
    <div class="note">الأسعار تقديرية ويؤكدها فريق المبيعات</div>

    <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inFrame = window.self !== window.top;
    const tellParent = (msg) => { if (inFrame) window.parent.postMessage({ source: 'radma-chat', ...msg }, '*'); };

    /* Storage may be blocked (private mode, third-party iframe): keep working in memory */
    const store = {
        get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } }
    };
    const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
    let session = store.get('radmaChatSession') || newSession();
    let history = store.get('radmaChatHistory') || [];
    let conf = { greeting: '', whatsapp: null, company_name: '' };
    let busy = false;

    /* WhatsApp-style *bold*, links, line breaks — on already-escaped text */
    const format = (text) => esc(text)
        .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

    function add(item, save = true) {
        const el = document.createElement('div');
        if (item.type === 'quote') {
            el.className = 'quote';
            const total = item.total_to != null && item.total_to !== item.total
                ? `${item.total.toFixed(2)} - ${item.total_to.toFixed(2)}` : Number(item.total).toFixed(2);
            el.innerHTML = `📄 عرض السعر رقم <strong dir="ltr">${esc(item.ref)}</strong><br>الإجمالي: ${esc(total)} ر.ع<br>
                <a href="${esc(item.pdf_url)}" target="_blank" rel="noopener">تحميل عرض السعر PDF</a>`;
        } else {
            el.className = 'msg ' + item.type;
            el.innerHTML = format(item.text);
        }
        $('messages').appendChild(el);
        $('messages').scrollTop = $('messages').scrollHeight;
        if (save && item.type !== 'error') {
            history.push(item);
            history = history.slice(-60);
            store.set('radmaChatHistory', history);
        }
    }

    function renderChips() {
        const chips = [];
        if (history.filter((h) => h.type === 'me').length === 0) {
            chips.push('<button type="button" data-say="أريد سعر بوابة رول شتر">سعر رول شتر</button>');
            chips.push('<button type="button" data-say="أريد سعر بوابة أوفرهيد">سعر أوفرهيد</button>');
            chips.push('<button type="button" data-say="أريد سعر مكينة بوابة">سعر مكينة بوابة</button>');
        }
        if (conf.whatsapp) chips.push(`<a href="https://wa.me/${esc(conf.whatsapp)}" target="_blank" rel="noopener">واتساب المبيعات</a>`);
        $('chips').innerHTML = chips.join('');
        $('chips').querySelectorAll('[data-say]').forEach((b) => b.addEventListener('click', () => send(b.dataset.say)));
    }

    function typing(on) {
        const old = document.querySelector('.typing');
        if (old) old.remove();
        if (on) {
            const el = document.createElement('div');
            el.className = 'typing';
            el.innerHTML = '<span></span><span></span><span></span>';
            $('messages').appendChild(el);
            $('messages').scrollTop = $('messages').scrollHeight;
        }
    }

    async function send(text) {
        text = String(text || '').trim();
        if (!text || busy) return;
        busy = true;
        $('sendBtn').disabled = true;
        add({ type: 'me', text });
        renderChips();
        typing(true);
        try {
            const res = await fetch('/api/public/chat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: session, message: text })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(res.status === 429 ? 'رسائل كثيرة خلال وقت قصير، حاول بعد قليل.' : data.error || 'تعذر الاتصال، حاول مرة أخرى.');
            typing(false);
            add({ type: 'bot', text: data.reply });
            for (const q of data.quotes || []) add({ type: 'quote', ...q });
        } catch (err) {
            typing(false);
            add({ type: 'error', text: err.message });
        } finally {
            busy = false;
            $('sendBtn').disabled = false;
            $('input').focus();
        }
    }

    function restart() {
        session = newSession();
        history = [];
        store.set('radmaChatSession', session);
        store.set('radmaChatHistory', history);
        $('messages').innerHTML = '';
        if (conf.greeting) add({ type: 'bot', text: conf.greeting });
        renderChips();
    }

    $('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const text = $('input').value;
        $('input').value = '';
        $('input').style.height = '';
        send(text);
    });
    $('input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
    });
    $('input').addEventListener('input', () => {
        $('input').style.height = '';
        $('input').style.height = Math.min(110, $('input').scrollHeight) + 'px';
    });
    $('restartBtn').addEventListener('click', restart);
    if (inFrame) {
        $('closeBtn').hidden = false;
        $('closeBtn').addEventListener('click', () => tellParent({ type: 'close' }));
    }

    (async () => {
        store.set('radmaChatSession', session);
        try {
            conf = await (await fetch('/api/public/chat/config')).json();
        } catch { /* keep defaults */ }
        if (conf.company_name) {
            $('companyName').textContent = conf.company_name + ' •';
            document.title = 'المساعد الذكي | ' + conf.company_name;
        }
        if (conf.enabled === false) {
            add({ type: 'error', text: 'المساعد غير متاح حالياً. تواصل معنا عبر واتساب.' }, false);
            $('input').disabled = true;
            $('sendBtn').disabled = true;
        } else if (history.length) {
            history.forEach((h) => add(h, false));
        } else if (conf.greeting) {
            add({ type: 'bot', text: conf.greeting });
        }
        renderChips();
    })();
    </script>
</body>
</html>
